<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="molten" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC24B"/>
      <stop offset="0.5" stop-color="#FF7A2F"/>
      <stop offset="1" stop-color="#D6402E"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="#0A0A0B"/>
  <!-- rift valley: two ridges forming a cleft -->
