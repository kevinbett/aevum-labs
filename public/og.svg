<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="molten" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC24B"/>
      <stop offset="0.5" stop-color="#FF7A2F"/>
      <stop offset="1" stop-color="#D6402E"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="8%" r="60%">
      <stop offset="0" stop-color="#FF7A2F" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FF7A2F" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#0A0A0B"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- large faint growth-ring motif on the right -->
  <g fill="none" stroke="url(#molten)" opacity="0.16" stroke-width="2">
    <circle cx="1000" cy="150" r="70"/>
    <circle cx="998" cy="148" r="120"/>
    <circle cx="996" cy="146" r="175"/>
    <circle cx="994" cy="144" r="235"/>
  </g>

  <!-- logomark -->
  <g transform="translate(90,86)">
    <rect width="76" height="76" rx="18" fill="#141416" stroke="rgba(255,255,255,0.1)"/>
    <g transform="translate(38,38) scale(1.187)">
      <g transform="translate(-32,-32)">
        <circle cx="33.5" cy="33" r="18" fill="none" stroke="url(#molten)" stroke-width="3" opacity="0.9"/>
        <circle cx="32.6" cy="32.4" r="12" fill="none" stroke="url(#molten)" stroke-width="3" opacity="0.62"/>
        <circle cx="31.8" cy="31.8" r="6" fill="none" stroke="url(#molten)" stroke-width="3" opacity="0.85"/>
        <circle cx="31.4" cy="31.6" r="2" fill="#FFC24B"/>
      </g>
    </g>
  </g>
  <text x="182" y="136" font-family="'Plus Jakarta Sans',sans-serif" font-size="30" font-weight="700" fill="#EDECEF">Aevum <tspan fill="#86858E" font-weight="500">Labs</tspan></text>

  <!-- headline -->
  <text x="90" y="330" font-family="Georgia,'Fraunces',serif" font-size="76" font-weight="400" fill="#EDECEF">We build software</text>
  <text x="90" y="418" font-family="Georgia,'Fraunces',serif" font-size="76" font-weight="400" font-style="italic" fill="url(#molten)">made to last.</text>

  <text x="90" y="486" font-family="'Plus Jakarta Sans',sans-serif" font-size="26" fill="#B6B5BD">Durable products, engineered to endure.</text>

  <!-- product row -->
  <g font-family="'Plus Jakarta Sans',sans-serif" font-size="22" font-weight="600">
    <text x="90" y="560" fill="#F0A83C">Zaamu</text>
    <text x="230" y="560" fill="#86858E">·</text>
    <text x="256" y="560" fill="#34D399">PesaScope</text>
    <text x="440" y="560" fill="#86858E">·</text>
    <text x="466" y="560" fill="#8B7FF5">Sampuli</text>
  </g>
</svg>
